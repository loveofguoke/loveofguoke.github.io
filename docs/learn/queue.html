<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习队列 · 果壳的宇宙</title><link rel="stylesheet" href="../assets/workbench.css"><script src="../assets/learning-store.js" defer></script><script src="../assets/site.js" defer></script><script src="learn.js" defer></script></head><body><header id="site-header" data-section="learn"></header><main><div class="subnav"><a href="./">学习总览</a><a class="active" href="queue.html">学习队列</a><a href="../atlas/">每日发现 ↗</a><a href="concepts.html">概念讨论台</a><span class="local-label">本机保存 · 用备份文件迁移设备</span></div>
<section class="hero"><span class="eyebrow">THE READING QUEUE</span><h1>给好问题，留一个位置。</h1><p class="lead">来自探索页面，也来自某次定向阅读。写下想读的理由，归入具体专题，然后开始。</p></section>
<details class="card" id="add-resource"><summary>＋ 添加一份资料</summary><form id="queue-form" class="queue-add"><label>资料链接<input id="resource-url" type="url" required placeholder="https://…"></label><label>标题<input id="resource-title" required maxlength="300" placeholder="文章、论文或代码仓库"></label><label class="wide">为什么读它？<input id="resource-reason" maxlength="1000" placeholder="想解决哪个问题，或者接在哪次学习之后"></label><label>归入专题<select id="resource-topic"></select></label><div class="actions"><button class="primary">加入学习队列</button></div></form></details>
<div class="queue-toolbar"><div id="queue-tabs" class="tabs" role="group" aria-label="队列状态"><button data-status="queued" aria-pressed="true">待学习</button><button data-status="reading" aria-pressed="false">进行中</button><button data-status="done" aria-pressed="false">已完成</button><button data-status="archived" aria-pressed="false">已归档</button><button data-status="all" aria-pressed="false">全部</button></div><div class="actions"><button id="export-state">导出备份</button><button id="import-state">导入备份</button><input id="import-file" type="file" accept=".json,application/json" hidden></div></div><p id="queue-summary" class="muted" role="status" aria-live="polite"></p><div id="queue-list" class="queue-list"></div><p class="quiet-line">专题、队列、个人笔记与学习会话都包含在备份里。导入时合并新条目，保留本机已有笔记和进度。</p><footer><span>少一点“以后会读”，多一点“现在弄懂”。</span><a href="./">返回学习总览 ↗</a></footer></main></body></html>
