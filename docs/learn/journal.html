<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习笔记 · 果壳的宇宙</title><link rel="stylesheet" href="../assets/workbench.css"><link rel="stylesheet" href="journal.css"><script src="../assets/learning-store.js" defer></script><script src="../assets/site.js" defer></script><script src="journal.js" defer></script></head><body><header id="site-header" data-section="learn"></header><main><div class="subnav"><a href="./">学习总览</a><a href="research.html">专题检索</a><a href="queue.html">学习队列</a><a class="active" href="journal.html">学习笔记</a><a href="concepts.html">概念讨论台</a></div><section class="hero"><span class="eyebrow">NOTES / UNDERSTANDING TAKES SHAPE</span><h1>让每次理解，<br>长成一张笔记。</h1><p class="lead">按时间留下思考，按主题重新相遇。公开整理与自己的学习记录，放在同一份可检索的索引里。</p><div class="actions"><button class="primary" id="new-note">＋ 写一张学习笔记</button><a class="button" href="queue.html">从待读开始 →</a></div></section><section class="section"><div class="journal-filters"><label>搜索笔记<input id="note-search" type="search" placeholder="标题、正文或资料链接…"></label><label>主题<select id="note-topic"><option value="">全部主题</option></select></label><label>范围<select id="note-scope"><option value="all">全部笔记</option><option value="public">公开整理</option><option value="personal">我的笔记</option></select></label></div><p class="muted" id="note-count" role="status" aria-live="polite"></p><div id="note-list" class="journal-list"></div><nav class="pagination" aria-label="笔记分页"><button id="prev-page">← 上一页</button><span id="page-number"></span><button id="next-page">下一页 →</button></nav></section><footer><span>个人笔记保存到本机，完整备份在学习队列页面导出。</span><a href="./">返回学习总览 →</a></footer></main><dialog id="note-dialog"><button class="dialog-close" id="close-note">关闭</button><h2>写下一次理解</h2><form id="note-form" class="session-form"><label>标题<input id="note-title" required maxlength="200"></label><label>主题<select id="edit-note-topic"></select></label><label>正文 · Markdown<textare
